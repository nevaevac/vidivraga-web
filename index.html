<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vidi vraga</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #f3f3f3;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .page {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .topbar {
      padding: 24px 40px;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .hero {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      padding: 0 40px 40px 40px;
      gap: 32px;
    }
    .copy {
      max-width: 520px;
    }
    .copy h1 {
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      line-height: 1.05;
      margin-bottom: 24px;
      letter-spacing: -0.03em;
    }
    .copy p {
      font-size: 1.15rem;
      line-height: 1.5;
      color: #555;
    }
    .visual {
      width: 100%;
      height: 75vh;
      min-height: 480px;
      position: relative;
    }
    #scene {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #scene:active {
      cursor: grabbing;
    }
    #scene canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      outline: none;
    }
    @media (max-width: 860px) {
      .hero {
        grid-template-columns: 1fr;
      }
      .visual {
        height: 55vh;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">Vidi vraga</header>
    <main class="hero">
      <section class="copy">
        <h1>Pametni hladnjak novog doba.</h1>
        <p>Interaktivni 3D prikaz. Kliknite i povucite za rotaciju.</p>
      </section>
      <section class="visual">
        <div id="scene"></div>
      </section>
    </main>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/controls/OrbitControls.js';

    const container = document.getElementById('scene');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      45,
      container.clientWidth / container.clientHeight,
      0.1,
      1000
    );
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Lighting setup
    const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.5);
    dirLight1.position.set(5, 10, 7);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xddeeff, 1.5);
    dirLight2.position.set(-5, 2, -5);
    scene.add(dirLight2);

    // GLTF Loading and auto-framing
    const loader = new GLTFLoader();
    loader.load(
      'fridge.glb?v=' + Date.now(),
      (gltf) => {
        const fridge = gltf.scene;

        // Apply clean metallic finish across the mesh
        fridge.traverse((child) => {
          if (child.isMesh) {
            child.material = new THREE.MeshStandardMaterial({
              color: 0xd0d5db,
              metalness: 0.65,
              roughness: 0.28
            });
          }
        });

        // Compute bounds to center and frame automatically
        const box = new THREE.Box3().setFromObject(fridge);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        fridge.position.sub(center);
        scene.add(fridge);

        const maxDim = Math.max(size.x, size.y, size.z);
        camera.position.set(0, 0, maxDim * 2.3);
        camera.lookAt(0, 0, 0);

        controls.target.set(0, 0, 0);
        controls.update();

        console.log('✅ FRIDGE RENDERED:', { size, center });
      },
      undefined,
      (error) => {
        console.error('Error loading GLTF:', error);
      }
    );

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      if (!container.clientWidth || !container.clientHeight) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
